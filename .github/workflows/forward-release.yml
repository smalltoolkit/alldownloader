name: Forward Release from alldownloader-build

# 手动触发：公开库 Actions 页 → Run workflow → 输入版本号（如 v0.1.0）
# 作用：把私有构建库 alldownloader-build 的 Release 资产（三平台安装包）
#       转发到本公开库的 Release 页。私有库源码永远不进入本仓库。
# 实现：curl + GitHub REST API 直传资产（repo scope 即可，不依赖 gh auth 的 read:org）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to forward (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

# 安全红线：本 workflow 仅 workflow_dispatch 手动触发，
# 禁用 pull_request* / issue 等一切事件（防止 fork 恶意 PR 窃取 secret）。
# 无 checkout 步骤 —— 本仓库不应含任何源码/构建脚本。

jobs:
  forward:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 必需
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_PAT }}
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Download release assets from private build repo
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -sS -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/smalltoolkit/alldownloader-build/releases/tags/${TAG}" \
            > /tmp/rel.json
          jq -r '.tag_name // error("tag not found: " + (.message // "?"))' /tmp/rel.json
          echo "assets: $(jq '.assets | length' /tmp/rel.json)"
          # 注意：必须用 API asset 端点（releases/assets/{id}）下载，
          # browser_download_url (releases/download/...) 对本仓库返回 404。
          jq -r '.assets[] | "\(.id)\t\(.name)"' /tmp/rel.json | while IFS=$'\t' read -r id name; do
            echo "downloading: ${name} (asset ${id})"
            curl -sSL -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o "assets/${name}" \
              "https://api.github.com/repos/smalltoolkit/alldownloader-build/releases/assets/${id}"
          done
          echo "--- downloaded ---"
          ls -la assets/
          for f in assets/*; do
            [ -s "$f" ] || { echo "EMPTY ASSET: $f"; exit 1; }
          done
          # 完整性校验：与 API 声明的 size 对比
          jq -r '.assets[] | "\(.size)\t\(.name)"' /tmp/rel.json | while IFS=$'\t' read -r size name; do
            actual=$(stat -c%s "assets/${name}")
            if [ "$actual" != "$size" ]; then
              echo "SIZE MISMATCH ${name}: expected ${size}, got ${actual}"
              exit 1
            fi
            echo "  OK ${name}: ${actual} bytes"
          done

      - name: Create or update release in this repo
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/smalltoolkit/alldownloader/releases/tags/${TAG}" \
            > /tmp/pub.json
          if jq -e '.id' /tmp/pub.json > /dev/null 2>&1; then
            echo "Release ${TAG} exists - uploading assets only"
            RELEASE_ID=$(jq -r '.id' /tmp/pub.json)
          else
            echo "Creating release ${TAG}"
            if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then PRE=true; else PRE=false; fi
            jq -n --arg tag "$TAG" --arg name "$TAG" --argjson pre "$PRE" \
              '{tag_name:$tag, name:$name, body:"Auto-forwarded from alldownloader-build. Download the file for your platform and unzip to run.", draft:false, prerelease:$pre}' \
              > /tmp/newrel.json
            curl -sS -X POST -H "Authorization: token ${GH_TOKEN}" -H "Content-Type: application/json" \
              -d @/tmp/newrel.json \
              "https://api.github.com/repos/smalltoolkit/alldownloader/releases" > /tmp/created.json
            RELEASE_ID=$(jq -r '.id // error("create failed: " + (.message // "?"))' /tmp/created.json)
          fi
          for f in assets/*; do
            NAME=$(basename "$f")
            echo "uploading: ${NAME}"
            curl -sS -X POST -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/smalltoolkit/alldownloader/releases/${RELEASE_ID}/assets?name=${NAME}" \
              | jq -r '"  uploaded: " + (.name // .message) + " " + ((.size // 0) | tostring)'
          done
          echo "--- final assets ---"
          curl -sS -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/smalltoolkit/alldownloader/releases/tags/${TAG}" \
            | jq -r '.assets[] | "  " + .name + " " + (.size|tostring)'
